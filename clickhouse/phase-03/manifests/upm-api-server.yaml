apiVersion: v1
kind: ServiceAccount
metadata:
  name: upm-api-server
  namespace: upm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upm-api-server
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - podtemplates
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
      - services
      - endpoints
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - upm.syntropycloud.io
    resources:
      - projects
      - unitsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - podmonitors
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - upm.syntropycloud.io
    resources:
      - units
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upm-api-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upm-api-server
subjects:
  - kind: ServiceAccount
    name: upm-api-server
    namespace: upm-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upm-api-server-config
  namespace: upm-system
data:
  LISTEN_ADDR: ":8080"
  REQUEST_TIMEOUT: "10m"
  PROMETHEUS_BASE_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  PROMETHEUS_TIMEOUT: "10s"
  DIAGNOSTICS_REPLICA_DELAY_WARN_SECONDS: "60"
  DIAGNOSTICS_REPLICA_DELAY_CRITICAL_SECONDS: "300"
  DIAGNOSTICS_REPLICATION_QUEUE_WARN: "50"
  DIAGNOSTICS_REPLICATION_QUEUE_CRITICAL: "500"
  DIAGNOSTICS_ACTIVE_PARTS_PER_PARTITION_WARN: "150"
  DIAGNOSTICS_INACTIVE_PARTS_WARN: "50"
  DIAGNOSTICS_MERGE_ELAPSED_WARN_SECONDS: "1800"
  DIAGNOSTICS_MUTATION_AGE_WARN_SECONDS: "600"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upm-api-server
  namespace: upm-system
  labels:
    app.kubernetes.io/name: upm-api-server
    app.kubernetes.io/part-of: upmio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upm-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upm-api-server
        app.kubernetes.io/part-of: upmio
    spec:
      serviceAccountName: upm-api-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upm-api-server
          image: localhost/upmio/upm-api-server:phase-07
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: upm-api-server-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: upm-api-server
  namespace: upm-system
  labels:
    app.kubernetes.io/name: upm-api-server
    app.kubernetes.io/part-of: upmio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: upm-api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30083
