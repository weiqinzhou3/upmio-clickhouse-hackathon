apiVersion: v1
kind: Secret
metadata:
  name: aes-secret-key
  namespace: upm-clickhouse-runtime
type: Opaque
stringData:
  AES_SECRET_KEY: REPLACE_WITH_32_BYTE_AES_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-runtime-secret
  namespace: upm-clickhouse-runtime
type: Opaque
stringData:
  CLICKHOUSE_ADMIN_PASSWORD: REPLACE_WITH_AES_256_CTR_IV_PREFIXED_CIPHERTEXT
  admin: REPLACE_WITH_SAME_AES_256_CTR_IV_PREFIXED_CIPHERTEXT
  default: REPLACE_WITH_SAME_AES_256_CTR_IV_PREFIXED_CIPHERTEXT
